name: EAS Build

# Manual only. Builds are slow and use EAS quota, so this never runs on push or PR.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      profile:
        description: Build profile from eas.json
        type: choice
        options:
          - development
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # SECRET REQUIRED HERE: add EXPO_TOKEN under
          # Settings > Secrets and variables > Actions. Create it at
          # https://expo.dev/settings/access-tokens
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        # The EXPO_PUBLIC_FIREBASE_* values are read from the matching profile
        # in eas.json (SECRET REQUIRED HERE). Prefer EAS environment variables
        # / secrets (eas env:create) over committing real values to eas.json.
        run: >-
          npx eas-cli build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive
          --no-wait
        env:
          # SECRET REQUIRED HERE: same EXPO_TOKEN as above, used by eas-cli.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
